spring:
  application:
    name: spesometro
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Neon sospende il compute solo quando non resta alcuna connessione aperta, e
      # fattura a tempo di calcolo. Con i default di Hikari (minimum-idle pari a
      # maximum-pool-size) il pool tiene 10 connessioni vive finché il processo è
      # vivo: il servizio su Render viene tenuto sveglio da un ping, quindi il
      # database non si sospendeva mai e consumava ~6 CU-hrs al giorno anche senza
      # nessuno che usasse l'app.
      # Prezzo di questa scelta: la prima query dopo una pausa paga il risveglio di
      # Neon (meno di un secondo), trascurabile rispetto al cold start di Render.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      # L'app è a uso personale: bastano poche connessioni, e un tetto basso evita
      # che un picco tenga occupato più compute del necessario.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Senza questo Spring scarta il testo delle ResponseStatusException e il client
# riceve un 400 nudo. Le eccezioni dell'app portano messaggi già scritti per chi
# legge ("Non ho trovato la tabella dei movimenti...", "Esiste già una categoria
# con questo nome"): buttarli via costringe il frontend a indovinare.
server:
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
