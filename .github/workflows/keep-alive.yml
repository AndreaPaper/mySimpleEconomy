name: Keep backend alive

on:
  schedule:
    # Copre le 9-21 orario italiano tutto l'anno: CET (UTC+1, inverno) rende
    # 9-21 locali come 8-20 UTC; CEST (UTC+2, estate) come 7-19 UTC. La
    # finestra qui sotto è l'unione dei due (7-20 UTC) per restare corretta
    # tutto l'anno senza logica DST-aware in un cron statico - in inverno fa
    # qualche ping extra verso le 8-9 locali, in estate verso le 21-22
    # locali: accettabile per semplicità.
    #
    # Ogni 5 minuti (non 10): GitHub non garantisce l'orario esatto dei cron
    # schedulati e può ritardarli di qualche minuto nei periodi di carico -
    # un margine più stretto riduce il rischio che un ritardo faccia superare
    # i 15 minuti di inattività che fanno riaddormentare Render.
    - cron: '*/5 7-20 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/ping"
