    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Il colore della barra del browser prima che parta l'app: lo sfondo della
         palette predefinita, chiaro o scuro come il telefono. Poi lo riallinea
         ThemeColorSync al tema e alla palette scelti nell'app. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5FAFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1620" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyEconomy" />
    <link rel="apple-touch-icon" href="/icons/icon192.png" />
    <title>MySimpleEconomy</title>
  </head>
